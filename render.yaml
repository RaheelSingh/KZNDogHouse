services:
  - type: web
    name: kzn-doghouse
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./src/web/KZNDoghouse.Web/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: Supabase__Url
        sync: false
      - key: Supabase__AnonKey
        sync: false
      - key: Supabase__ServiceRoleKey
        sync: false
      - key: GoogleMaps__EmbedApiKey
        sync: false